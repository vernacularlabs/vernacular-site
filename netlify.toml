# Netlify config for Vernacular Labs site

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache immutable build assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /georgia-2026 was the unlisted info page for the earlier call-in pilot; retired 2026-09-24.
[[redirects]]
  from = "/georgia-2026"
  to = "/"
  status = 301

# TwiML replies for the study toll-free number (see public/twilio/).
[[headers]]
  for = "/twilio/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
